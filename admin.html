<!doctype html><html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HorviPlay • Administrácia</title><style>body{font:16px system-ui;background:#101322;color:white;max-width:720px;margin:35px auto;padding:20px}input,button,select{display:block;width:100%;padding:13px;margin:10px 0;background:#1b2235;color:white;border:1px solid #59617a;border-radius:12px;box-sizing:border-box}button{background:#655ce0;cursor:pointer}article{border:1px solid #414963;padding:15px;border-radius:14px;margin:12px 0}a{color:#aaa7ff}.muted{color:#b0bad0}#panel{display:none}</style><h1>🛡️ HorviPlay administrácia</h1><p><a href="./">← Katalóg</a></p><section id="login"><h2>Prihlásenie správcu</h2><input id="email" type="email" placeholder="E-mail" autocomplete="username"><input id="password" type="password" placeholder="Heslo" autocomplete="current-password"><button id="signin">Prihlásiť sa</button></section><section id="panel"><button id="signout">Odhlásiť sa</button><h2>Pridať / upraviť aplikáciu</h2><form id="edit"><input id="id" placeholder="ID (pri novej aplikácii nechaj prázdne)" readonly><input id="name" placeholder="Názov" required><input id="icon" placeholder="Ikona, napr. 📱" value="📱"><select id="cat"><option>Rodina</option><option>Firma</option><option>Vzdelávanie</option><option>Ostatné</option></select><input id="url" type="url" placeholder="https://... (nepovinné)"><input id="description" placeholder="Popis"><button>Uložiť do spoločného katalógu</button><button type="button" id="clear">Nová aplikácia</button></form><h2>Spoločné aplikácie</h2><div id="items"></div></section><p id="status" class="muted"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const client=supabase.createClient("https://wbekklhwadrkpvaskuif.supabase.co","sb_publishable_-DLbvpDkSef5-cxT8Z7ibA_122e2HO3");const $=x=>document.querySelector(x);let rows=[];const status=s=>$('#status').textContent=s;function clear(){['id','name','url','description'].forEach(k=>$('#'+k).value='');$('#icon').value='📱';$('#cat').value='Rodina'}$('#clear').onclick=clear;
async function refresh(){const {data,error}=await client.from('horviplay_catalog').select('*').order('name');if(error){status(error.message);return}rows=data||[];$('#items').replaceChildren(...rows.map(a=>{const el=document.createElement('article');const t=document.createElement('span');t.textContent=(a.icon||'📱')+' '+a.name+' — '+(a.url||'Bez odkazu');const b=document.createElement('button');b.textContent='Upraviť';b.onclick=()=>{for(const k of ['id','name','icon','cat','url','description'])$('#'+k).value=a[k]||'';window.scrollTo(0,0)};el.append(t,b);return el}));}
async function state(){const {data}=await client.auth.getSession();const logged=!!data.session;$('#login').style.display=logged?'none':'block';$('#panel').style.display=logged?'block':'none';if(logged)await refresh()}
$('#signin').onclick=async()=>{status('Prihlasujem...');const {error}=await client.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)status(error.message);else{status('Prihlásené. Zmeny môže uložiť len účet s oprávnením administrátora.');await state()}};
$('#signout').onclick=async()=>{await client.auth.signOut();status('Odhlásené');await state()};
$('#edit').onsubmit=async e=>{e.preventDefault();const a={id:$('#id').value||'app-'+crypto.randomUUID(),name:$('#name').value.trim(),icon:$('#icon').value.trim()||'📱',cat:$('#cat').value,url:$('#url').value.trim(),description:$('#description').value.trim(),updated_at:new Date().toISOString()};status('Ukladám...');const {error}=await client.from('horviplay_catalog').upsert(a);if(error){status('Nepodarilo sa uložiť: '+error.message+' (skontroluj administrátorské práva a SQL tabuľky)')}else{status('Uložené do spoločného katalógu.');clear();await refresh()}};
client.auth.onAuthStateChange(()=>{setTimeout(state,0)});state();
</script></html>
